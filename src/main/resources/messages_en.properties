# GroundItemCap messages (MiniMessage). <prefix> is replaced with the prefix below.
# Arguments: <arg:0>, <arg:1>, ... Players see the file matching their client language.
prefix=<#9BE15D>GroundItemCap</#9BE15D> <dark_gray>»</dark_gray>
status=<prefix> <gray>Items on the ground: <white><arg:0></white> <dark_gray>|</dark_gray> Limit: <white><arg:1></white> <dark_gray>|</dark_gray> Removed since start: <white><arg:2></white></gray>
reloaded=<prefix> <green>Settings reloaded.</green> <gray>Limit: <white><arg:0></white></gray>
reload-failed=<prefix> <red>Could not read the configuration, check the server console.</red>
usage=<prefix> <gray>Usage: <white>/grounditemcap [reload]</white></gray>
no-permission=<prefix> <red>You do not have permission to do that.</red>
